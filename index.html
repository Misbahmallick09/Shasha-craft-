<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crocheting – it all starts with one stitch</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--f:'Fredoka',sans-serif;--m:#5b0f3b;--pu:#7b2b63;--pl:#86215f;--pk:#fbe4e8;--ro:#f9cfe2;--ye:#fdf3a8}
*{box-sizing:border-box;margin:0}
body{font:400 14px/1.55 var(--f);background:var(--pk);color:var(--m)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}svg{display:block}
:focus-visible{outline:3px solid #e0578f;outline-offset:2px}
h1,h2,h3,.fr{font-weight:700}h1,h2,h3{color:var(--pu)}.sc{font-weight:600}
.w{max-width:900px;margin:auto}
/* hero */
.hero{position:relative;overflow:hidden;padding:18px 6vw 56px}
.patch{position:absolute;left:0;top:0;width:170px;height:170px;overflow:hidden}
.patch i{position:absolute;left:-10px;width:300px;height:24px;transform-origin:0 0;transform:rotate(-40deg);box-shadow:0 2px 4px #0004}
.patch i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff4 0 2px,transparent 2px 5px)}
.patch i:nth-child(1){top:58px;background:#1f4458}
.patch i:nth-child(2){top:90px;background:repeating-linear-gradient(90deg,#ec6a9c 0 9px,#f7b5cc 9px 18px)}
.patch i:nth-child(3){top:122px;background:conic-gradient(#fff 25%,#2f8a57 0 50%,#fff 0 75%,#2f8a57 0) 0 0/24px 24px}
.nav{display:flex;justify-content:flex-end;gap:14px;font-size:21px;position:relative;z-index:2}
.logo{text-align:center;margin-top:26px}
.logo h1{font:700 clamp(58px,15vw,118px)/1 var(--f);color:var(--m)}
.ball{display:inline-block;position:relative;width:.74em;height:.74em;border-radius:50%;vertical-align:-.03em;background:radial-gradient(circle at 35% 30%,#ffb27c,#dc5a2c 55%,#9c3416)}
.ball::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(35deg,transparent 0 .09em,#fff5 .09em .13em)}
.ball::after{content:"";position:absolute;left:32%;top:-.3em;width:.05em;height:.5em;background:#4a2a1a;transform:rotate(-25deg)}
.tag{font:500 22px var(--f);margin-top:2px}
.story{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:center;margin-top:34px}
.st{position:relative;padding-left:24px}.ht{position:absolute;left:-22px;top:34px;width:42px}
h2{font-size:30px}.st p{max-width:310px;margin-top:6px;font-size:13px}
.star{position:relative;max-width:340px;width:100%;aspect-ratio:1;margin-left:auto;display:grid;place-items:center;filter:drop-shadow(5px 8px 5px #0003)}
.star::before{content:"";position:absolute;inset:0;background:var(--ye);clip-path:polygon(50% 0,60% 22%,85% 8%,78% 33%,100% 40%,80% 57%,95% 82%,68% 74%,60% 100%,45% 78%,20% 95%,26% 68%,0 58%,22% 42%,8% 18%,34% 26%)}
.star .ch{position:relative;width:62%;margin-left:12%}.star .bs{position:absolute;left:16%;top:18%;width:26%}
.wk{display:flex;align-items:center;gap:8px;margin-top:30px}
.work{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px;text-align:center}
.work img{display:block;width:74%;aspect-ratio:1;object-fit:cover;border-radius:50%;margin:auto;border:3px solid #fff;box-shadow:0 3px 8px #0003}.work span{display:block;font-size:12.5px;margin-top:6px;line-height:1.25}
/* shop */
.shop{background:#84215d;position:relative}
.sh{position:relative;z-index:1;background:linear-gradient(#f6c9df,#c765a0 55%,#9a2f72);padding:16px 5vw 40px}
.sh::after{content:"";position:absolute;left:0;right:0;bottom:-33px;height:34px;background:radial-gradient(circle at 50% 0,#9a2f72 16px,transparent 17px) 0 0/36px 34px repeat-x;filter:drop-shadow(0 3px 0 #b84d93)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ttl{flex:0 0 100%;display:flex;align-items:center;gap:8px;color:#fff;font-size:26px}
.shp{position:relative;display:block}.shp svg{width:34px;height:34px}
.shp b{position:absolute;top:-5px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--m);color:#fff;font:600 10px/17px var(--f);text-align:center}.shp b:empty{display:none}
.se{flex:1;display:flex;max-width:420px;background:#fff;border-radius:30px;padding:3px 3px 3px 16px}
.se input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:13px}
.se button{border:0;background:var(--pl);color:#fff;width:32px;height:32px;border-radius:50%}
.so{border:0;background:none;font-size:13px}
.cats{display:flex;justify-content:space-around;flex-wrap:wrap;margin-top:18px;font:600 16px var(--f)}
.cats button{border:0;background:none;color:var(--m);padding:2px 9px;border-radius:14px;font:inherit}.cats .on{background:#fff6}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start;padding:46px 4vw 56px}
.card{display:block;border-radius:18px;overflow:hidden;background:linear-gradient(#fdeaf1,#e7b5cc);box-shadow:inset 0 0 0 2px #fff7,0 4px 10px #0003;transition:transform .2s}
.card:hover{transform:translateY(-3px)}.card img{display:block;width:100%;height:auto}
.cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;font-weight:600}.cap span:last-child{color:var(--pl);white-space:nowrap}
.none{grid-column:1/-1;color:#fff;text-align:center}
/* custom */
.custom{position:relative;background:var(--ro);padding:46px 6vw 50px}
.custom::before{content:"";position:absolute;left:0;right:0;top:-17px;height:18px;background:radial-gradient(circle at 50% 100%,var(--ro) 17px,transparent 18px) 0 0/40px 18px repeat-x}
.cin{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.cl small{font-size:12px;color:var(--m)}.custom h2{font-size:38px;color:var(--m);line-height:1.1}.gift{width:210px;margin-top:8px}
.yarn{width:100px;height:60px;background:radial-gradient(circle at 30% 50%,#f3e4cf 26px,transparent 27px),radial-gradient(circle at 70% 62%,#e8cdbf 22px,transparent 23px)}
form,.panel{position:relative;background:#f1a8cb;border-radius:18px;padding:20px;display:grid;gap:10px}
label,.lb{font-weight:600;font-size:12px}
.in,select,textarea{display:block;width:100%;border:0;border-radius:8px;padding:9px 10px;background:#fbd9e7;font-size:13px;margin-top:3px}textarea{min-height:56px;resize:vertical}
.drop{display:grid;place-items:center;height:60px;border:2px dashed var(--m);border-radius:10px;cursor:pointer}
.bt{position:absolute;right:-8px;top:-16px;width:76px;height:62px;background:radial-gradient(circle at 25% 35%,#e86ea0 11px,transparent 12px),radial-gradient(circle at 65% 25%,#f8c5d9 10px,transparent 11px),radial-gradient(circle at 70% 70%,#c77ab8 9px,transparent 10px),radial-gradient(circle at 30% 80%,#fff 8px,transparent 9px)}
.btn{border:0;border-radius:22px;background:var(--pl);color:#fff;font-weight:600;font-size:13px;padding:10px 22px;display:inline-block;justify-self:end}
.btn.wa{background:#25d366}.btn.g{background:#fff;color:var(--pl);padding:6px 12px}.msg{display:none;font-weight:600;font-size:13px}
/* footer */
footer{position:relative;overflow:hidden;background:#fde7ee;padding:34px 6vw 18px}
.fin{display:flex;gap:56px;flex-wrap:wrap;font-size:12.5px}.fin a{display:block}.fin b{display:block;width:max-content;border-bottom:1px solid var(--m);margin-bottom:4px;font-weight:600}
.hk{position:absolute;right:10px;bottom:0;width:120px;height:90px;background:repeating-linear-gradient(118deg,transparent 0 11px,#f58db9 11px 14px,#fff 14px 15px);clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.made{position:relative;text-align:center;font:700 34px var(--f);margin-top:22px;border-top:1px solid #e9b4c8;padding-top:10px}
/* pages */
.pg{min-height:100vh;padding:18px 6vw 70px}.tb{display:flex;justify-content:space-between;align-items:center}.bk{font-weight:600;color:var(--pu)}
.pgr{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px;align-items:start}
.big{border-radius:24px;overflow:hidden;box-shadow:0 5px 12px #0003}.big img{display:block;width:100%;height:auto}
h1{font-size:32px;line-height:1.2}.pr{font:700 28px var(--f);color:var(--pl);margin:6px 0}.pr s{font-size:15px;opacity:.6}.pr em{font:600 12px var(--f);background:var(--ye);padding:2px 8px;border-radius:10px;color:var(--m)}
.ft{margin:10px 0 14px 18px;font-size:13px}.row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.qty{display:flex;align-items:center;background:#fff;border-radius:20px}.qty button{border:0;background:none;font-size:18px;width:34px;height:34px}.qty span{min-width:22px;text-align:center}
.sm{font-size:22px;margin:30px 0 10px}.rel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rel .card img{aspect-ratio:1;object-fit:cover}
.ci{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px}.ci .i{flex:1;font-size:13.5px}
.em{width:56px;height:56px;border-radius:12px;overflow:hidden}.em img{width:100%;height:100%;object-fit:cover}
.wafab{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 4px 14px #0004;z-index:9}.wafab svg{width:34px;height:34px}
@media(max-width:640px){.cin,.pgr{grid-template-columns:1fr}.st p{font-size:12px}.star{max-width:100%}.rel{grid-template-columns:repeat(2,1fr)}.fin{gap:28px}}

.chd{text-align:center;margin-bottom:24px}.chd small{font-weight:600;font-size:12px}.chd p{max-width:460px;margin:6px auto 0}
.cl{text-align:center}.cl h3{color:var(--m);font-size:22px;margin-top:6px}.cl p{max-width:320px;margin:4px auto 0}.gift{margin:8px auto 0}
.tb2{display:inline-block;background:#fff;color:var(--pl);font-weight:600;font-size:12px;padding:5px 12px;border-radius:20px;margin-top:12px}.custom .btn{justify-self:stretch;text-align:center}
</style></head><body>

<svg class="ch" viewBox="0 0 120 120"><path d="M16 104Q60 122 106 100" stroke="#8a4b2a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M38 22L48 96M38 76L90 80M90 80L96 102M48 96L44 104" stroke="#8a4b2a" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="60" cy="30" r="9" fill="#3a1a14"/><path d="M52 40Q72 36 76 62L64 78 44 72Z" fill="#d9442b"/><path d="M62 76L90 84 94 102" stroke="#2f6b4a" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="84" cy="94" r="6" fill="#e85a3a"/></svg></div></section>
<section><h2 class="wk"><svg width="20" height="30" viewBox="0 0 22 30"><path d="M4 28L16 2M9 28L20 6" stroke="#7b2b63" stroke-width="2.5" fill="none"/></svg>my work</h2>
<div class="work">${P.map(p=>`<a href="#/product/${p.id}">${im(p.s,p.n)}<span class="sc">${p.k}</span></a>`).join("")}</div></section></div></header>
<main><section class="shop" id="shop"><div class="sh"><div class="w"><div class="bar"><div class="ttl"><a class="shp" href="#/cart" aria-label="Cart">${ct}<b>${cnt()}</b></a><span class="fr">shop</span></div>
<label class="se"><input id="q" type="search" placeholder="Search an item" aria-label="Search items" value="${esc(term)}"><button type="button" aria-label="Search">⌕</button></label><button class="so" id="so">Sort ▾</button></div>
<div class="cats" id="cats">${[["all","All"],["scarf","Scarves"],["band","Headbands"],["bandana","Bandanas"]].map(x=>`<button data-c="${x[0]}" class="${cat==x[0]?"on":""}">${x[1]}</button>`).join("")}</div></div></div>
<div class="w grid" id="grid"></div></section>
<section class="custom" id="custom"><div class="w"><div class="chd"><small>Made just for you</small><h2>Custom Order</h2><p>Have a specific design, color palette, or yarn idea in mind? Let's bring it to life!</p></div>
<div class="cin"><div class="cl"><svg class="gift" viewBox="0 0 160 130" aria-hidden="true"><path d="M10 60l60-18 70 20-62 26z" fill="#f48fb9"/><path d="M10 60v36l68 22V88z" fill="#f9b3d0"/><path d="M78 88l62-26v34l-62 22z" fill="#ee78a8"/><ellipse cx="82" cy="52" rx="22" ry="20" fill="#1b1b1f"/><path d="M64 40L62 22 76 32ZM100 40L102 22 88 32Z" fill="#1b1b1f"/><circle cx="74" cy="50" r="4" fill="#fff"/><circle cx="92" cy="50" r="4" fill="#fff"/><rect x="62" y="68" width="40" height="30" rx="14" fill="#1b1b1f"/></svg><h3>Custom Crochet Box</h3><p>Pick your favorite yarn colors, dimensions, or send an inspirational photo from Pinterest!</p><span class="tb2">⏱ Turnaround: 5-7 Days</span></div>
<form id="of"><span class="bt"></span><label>What would you like?<select id="oc" required><option value="">Select a category...</option><option>Custom Plushie / Amigurumi</option><option>Custom Crochet Bag / Tote</option><option>Custom Top / Cardigan</option><option>Custom Scarf / Hat / Keychain</option></select></label>
<label>Tell me about your idea<textarea id="oi" placeholder="Describe your dream piece..." required></textarea></label>
<label>Upload inspiration image (optional)<input class="in" id="ph" type="file" accept="image/*"></label>
<button class="btn" type="submit">Send Custom Request</button><p class="msg" id="om" role="status">Saved! WhatsApp is opening 💗</p></form></div></div></section></main>
<footer><div class="w fin"><div><a href="#/">Home</a><a href="#story">Our story</a><a href="#shop">Shop</a><a href="#custom">Custom order</a></div><div><b>Stay in touch</b>✉ hello@crocheting.com<br>☎ +91 99999 99999<br>⚲ India</div><div><b>Contact me</b>Instagram · Pinterest<a href="#/admin">Admin (demo)</a></div></div><div class="hk"></div><p class="made">Made with love</p></footer>`;
const draw=()=>{let l=P.filter(p=>(cat=="all"||p.c==cat)&&p.n.toLowerCase().includes(term));
if(asc!==null)l=[...l].sort((a,b)=>asc?a.p-b.p:b.p-a.p);
m0=innerWidth<640;const L=l.length,sp=i=>m0?(L%2&&i==L-1?6:3):(L==5?(i<3?2:3):L>=3?2:3);
$("grid").innerHTML=l.map((p,i)=>`<a class="card" href="#/product/${p.id}" aria-label="${p.n}, ${rs(p.p)}" style="grid-column:span ${sp(i)}">${im(p.s,p.n)}<div class="cap"><span>${p.n}</span><span>${rs(p.p)}</span></div></a>`).join("")||'<p class="none">No items found. Try another word.</p>'};draw();
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();draw()};
$("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#cats button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cat=b.dataset.c;draw()};
$("so").onclick=e=>{asc=asc!==true;e.target.textContent=asc?"Price: low ▾":"Price: high ▾";draw()};
$("of").onsubmit=e=>{e.preventDefault();const o={cat:$("oc").value,idea:$("oi").value,photo:$("ph").files.length>0,date:new Date().toISOString()},a=db("customOrders");a.push(o);db("customOrders",a);
open(wa(`Custom order 🧶\nCategory: ${o.cat}\nIdea: ${o.idea}${o.photo?"\n(I'll share my inspiration photo here)":""}`),"_blank");$("om").style.display="block";e.target.reset()};
onresize=()=>{if($("grid")&&(innerWidth<640)!=m0)draw()}}
function product(id){const p=P.find(x=>x.id==id);if(!p){location.hash="#/";return}
let q=1;wb.href=wa(`Hi! I'm interested in ${p.n} (${rs(p.p)})`);
app.innerHTML=`<div class="pg"><div class="w"><div class="tb"><a class="bk" href="#shop">← Back to shop</a><a class="shp" href="#/cart" aria-label="Cart">${ct}<b>${cnt()}</b></a></div>
<div class="pgr"><div class="big">${im(p.s,p.n)}</div><div><h1>${p.n}</h1><p class="pr">${rs(p.p)} <s>${rs(p.o)}</s> <em>${Math.round((1-p.p/p.o)*100)}% off</em></p><p>${p.d}</p>
<ul class="ft"><li>Handmade in India</li><li>Free shipping above ₹999</li><li>Cash on delivery available</li></ul>
<div class="row"><div class="qty"><button id="mi" aria-label="Less">−</button><span id="qn">1</span><button id="pl" aria-label="More">+</button></div><button class="btn" id="ad">Add to cart</button></div>
<a class="btn wa" id="ow" target="_blank" rel="noopener">Order on WhatsApp</a></div></div>
<h3 class="sm">You may also like</h3><div class="rel">${P.filter(x=>x.id!=id).slice(0,4).map(x=>`<a class="card" href="#/product/${x.id}" aria-label="${x.n}">${im(x.s,x.n)}<div class="cap"><span>${x.k}</span><span>${rs(x.p)}</span></div></a>`).join("")}</div></div></div>`;
const u=()=>{$("qn").textContent=q;$("ow").href=wa(`Hi! I want to order:\n${p.n} x ${q}\nTotal: ${rs(p.p*q)}`)};u();
$("mi").onclick=()=>{q=Math.max(1,q-1);u()};$("pl").onclick=()=>{q++;u()};$("ad").onclick=()=>{add(p.id,q);location.hash="#/cart"};scrollTo(0,0)}
function cartPage(){wb.href=wa("Hi Amika!");const r=cart.map(i=>({...P.find(p=>p.id==i.id),q:i.q})),t=r.reduce((a,x)=>a+x.p*x.q,0);
app.innerHTML=`<div class="pg"><div class="w" style="max-width:620px"><a class="bk" href="#shop">← Keep shopping</a><h1 style="margin:12px 0">Your cart</h1>${r.map(x=>`<div class="ci"><div class="em">${im(x.s,x.n)}</div><div class="i"><b>${x.n}</b><br>${rs(x.p)} × ${x.q}</div><button class="btn g" data-d="${x.id}" aria-label="Remove ${x.n}">✕</button></div>`).join("")||"<p>Your cart is empty.</p>"}${r.length?`<p class="pr">Total: ${rs(t)}</p><div class="panel"><label>Name<input class="in" id="cn"></label><label>Delivery address<textarea id="ca"></textarea></label><button class="btn wa" id="co">Place order on WhatsApp</button></div>`:""}</div></div>`;
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!=b.dataset.d);db("cart",cart);cartPage()});
const c=$("co");if(c)c.onclick=()=>{const o={items:r.map(x=>({n:x.n,q:x.q})),total:t,name:$("cn").value,addr:$("ca").value,date:new Date().toISOString()},a=db("orders");a.push(o);db("orders",a);
open(wa(`New order 🧶\n${r.map(x=>`${x.n} x ${x.q} = ${rs(x.p*x.q)}`).join("\n")}\nTotal: ${rs(t)}\nName: ${o.name}\nAddress: ${o.addr}`),"_blank");cart=[];db("cart",cart);cartPage()};scrollTo(0,0)}
function admin(){const o=db("orders"),c=db("customOrders");
app.innerHTML=`<div class="pg"><div class="w" style="max-width:700px"><a class="bk" href="#/">← Home</a><h1 style="margin:12px 0">Orders (demo backend)</h1><p>Saved in this browser only (localStorage). A real server and database can replace this later.</p>
<h3 class="sm">Shop orders (${o.length})</h3>${o.map(x=>`<div class="ci"><div class="i">${x.date.slice(0,10)} · ${esc(x.name)}<br>${x.items.map(i=>esc(i.n)+" ×"+i.q).join(", ")} — <b>${rs(x.total)}</b><br>${esc(x.addr)}</div></div>`).join("")||"<p>No orders yet.</p>"}
<h3 class="sm">Custom requests (${c.length})</h3>${c.map(x=>`<div class="ci"><div class="i">${x.date.slice(0,10)} · ${esc(x.cat)}<br>${esc(x.idea)}</div></div>`).join("")||"<p>None yet.</p>"}
<button class="btn" id="clr">Clear all</button></div></div>`;$("clr").onclick=()=>{db("orders",[]);db("customOrders",[]);admin()};scrollTo(0,0)}
function route(){const h=location.hash,m=h.match(/^#\/product\/(\d+)/);
if(m)return product(+m[1]);if(h=="#/cart")return cartPage();if(h=="#/admin")return admin();
if(!$("shop"))home();const t=h.length>2&&h[1]!="/"?$(h.slice(1)):null;t?t.scrollIntoView():scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
